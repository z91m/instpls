name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential unzip zip libxml2-dev

      - name: Install ldid
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x ldid
          sudo mv ldid /usr/local/bin/

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDKs
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.zip -o $HOME/sdks.zip
          unzip -q $HOME/sdks.zip -d $HOME/theos/sdks
          mv $HOME/theos/sdks/sdks-master/* $HOME/theos/sdks/
          rm -rf $HOME/theos/sdks/sdks-master $HOME/sdks.zip

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instpls.deb
          path: ./*.deb