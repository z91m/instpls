name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the tweak
        run: |
          make package
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instpls.deb
          path: ./*.deb