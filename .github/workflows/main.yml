name: Build Tweak (macOS)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          sudo mkdir -p $HOME/theos/sdks
          sudo ln -sf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk $HOME/theos/sdks/iPhoneOS.sdk

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Extract dylib from deb or obj
        run: |
          find . -name "*.dylib" ! -path "*/.theos/*" -exec cp {} instpls.dylib \;

          if [ ! -f instpls.dylib ]; then
            cd packages
            ar -x *.deb
            if [ -f data.tar.xz ]; then
              tar -xf data.tar.xz
            elif [ -f data.tar.gz ]; then
              tar -xzf data.tar.gz
            fi
            find . -name "*.dylib" -exec cp {} ../instpls.dylib \;
            cd ..
          fi

          ls -la instpls.dylib

      - name: Upload dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instpls-dylib
          path: instpls.dylib

      - name: Upload deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instpls-deb
          path: packages/*.deb
