name: Build Tweak (macOS)
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'رابط مباشر لملف IPA المفكك'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA
        run: curl -L -o app.ipa "${{ github.event.inputs.ipa_url }}"

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          sudo mkdir -p $HOME/theos/sdks
          sudo ln -sf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk $HOME/theos/sdks/iPhoneOS.sdk

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Extract dylib from deb
        run: |
          cd packages
          ar -x *.deb
          tar -xf data.tar.xz
          find . -name "*.dylib" -exec cp {} ../instpls.dylib \;
          cd ..

      - name: Inject dylib into IPA
        run: |
          curl -L -o insert_dylib https://github.com/tyilo/insert_dylib/releases/latest/download/insert_dylib
          chmod +x insert_dylib
          unzip -q app.ipa -d app_payload
          APP_PATH=$(find app_payload/Payload -name "*.app" -type d | head -n 1)
          EXECUTABLE=$(find "$APP_PATH" -type f -perm +111 -print | head -n 1)
          ./insert_dylib --inplace --all-yes "$(pwd)/instpls.dylib" "$EXECUTABLE"
          cd app_payload && zip -r ../modified.ipa * && cd ..

      - name: Upload modified IPA
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-modified
          path: modified.ipa
