name: Build Tweak (macOS)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          sudo mkdir -p $HOME/theos/sdks
          sudo ln -sf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk $HOME/theos/sdks/iPhoneOS.sdk

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Extract dylib from deb
        run: |
          brew install dpkg

          echo "محتوى مجلد packages:"
          ls -la packages || echo "لا يوجد مجلد packages"

          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "❌ لم يتم العثور على ملف deb"
            exit 1
          fi
          echo "✅ تم العثور على: $DEB_FILE"

          mkdir -p extracted
          dpkg-deb -x "$DEB_FILE" extracted

          find extracted -name "*.dylib" -exec cp {} instpls.dylib \;

          if [ ! -f instpls.dylib ]; then
            echo "❌ لم يتم استخراج dylib من الحزمة"
            find extracted -type f
            exit 1
          fi

          ls -la instpls.dylib

      - name: Upload dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instpls-dylib
          path: instpls.dylib

      - name: Upload deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instpls-deb
          path: packages/*.deb
